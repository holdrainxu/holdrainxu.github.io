    Projects:
      - name: Spatiotemporal intelligent rockburst early-warning in deep hard rock
        summary: >-
          NSFC General Program · 500 k CNY · PI: Prof. Shibin Tang · Role: core technical
          contributor. Pioneered the use of diffusion models in engineering microseismic denoising
          to preserve weak precursory signals, and built a deep-learning spatiotemporal early-
          warning model for rockburst on top of the denoised data; published in Adv. Eng. Inform.
          (CAS Tier-1 Top, IF 9.9).
        highlights:
          - "Diffusion-based microseismic denoiser (Adv. Eng. Inform., 2026)"
          - "Spatiotemporal early-warning network for rockburst"
        start_date: 2024-01-01
        end_date: present

      - name: Progressive deterioration & protective mining of steep high-cold open-pit slopes (Xinjiang)
        summary: >-
          NSFC Joint Fund Program · 570 k CNY · PI: Prof. Shibin Tang · Role: core technical
          contributor. Targeting the difficulty of deploying conventional contact-based monitoring
          in steep, high-cold environments, developed a non-contact vision-based deformation
          monitoring solution and built a lightweight edge-side prototype, providing a key
          observation channel for progressive slope-deterioration warning. Methods are protected
          by a granted Chinese invention patent.
        start_date: 2023-01-01
        end_date: present

      - name: Digitalization & intelligent recognition of tunnel engineering-geological information under complex environments
        summary: >-
          Industry contract with Guangxi Hydraulic & Electric Survey, Design and Research Institute ·
          2,000 k CNY · 2025.10–2027.10 · Role: sole technical lead. Owned the entire pipeline from
          requirement analysis to algorithm delivery, independently developing core algorithms
          including the Digital Tunnel Geometry Model (DTGM), intelligent rock-mass fracture
          identification, tunnel over/under-excavation recognition and defect detection. Underpins
          one IJRMMS (CAS Tier-1 Top) paper and 3 granted invention patents.
        start_date: 2025-10-01
        end_date: 2027-10-01

      - name: High-density feature-tracking-based real-time intelligent monitoring of slope deformation
        summary: >-
          Industry contract with Guangxi Jiaoke Group · 300 k CNY · 2026.01–2027.02 · Role: sole
          technical lead. Independently delivered the project end-to-end, from technical roadmap
          to on-site deployment. Targeting large-area, low-cost, automated, real-time deformation
          detection in cluttered natural scenes, proposed and implemented a high-density
          pixel-tracking visual solution, protected by a granted Chinese invention patent.
        start_date: 2026-01-01
        end_date: 2027-02-01

      - name: Other classified national engineering projects
        summary: Details available upon request, subject to confidentiality.

      - name: NSFC Young Student Basic Research Program (Doctoral) · sole applicant
        summary: >-
          Independently authored all core sections of the proposal — rationale, research content,
          technical roadmap, feasibility analysis, expected outcomes — and submitted as the sole
          applicant. End-to-end experience of an academic-grant application from research-question
          framing to roadmap design.
        start_date: 2025-01-01

