    Publications:
      - title: A dual-condition diffusion-based microseismic signals denoiser for real-world engineering noise
        authors:
          - "Haoran Xu"
          - "Shibin Tang*"
          - "Yang Mao"
        publisher: "Advanced Engineering Informatics, 71, 104374 · CAS Tier-1 Top, IF 9.9"
        releaseDate: 2026-01-01
        summary: >-
          Pioneered the use of diffusion models for engineering microseismic denoising. A
          dual-condition reverse process preserves weak precursors of failure under realistic
          engineering noise and provides cleaner inputs for rockburst early-warning models.

      - title: "Digital tunnel geometry model (DTGM): A multimodal data-fusion framework for rock mass feature quantification"
        authors:
          - "Haoran Xu"
          - "Shibin Tang*"
        publisher: "Int. J. Rock Mechanics & Mining Sciences, 194, 106212 · CAS Tier-1 Top, IF 7.5"
        releaseDate: 2025-09-01
        summary: >-
          A LiDAR + photogrammetry fusion framework that produces a textured, geo-referenced 3D
          model of the tunnel face and walls, and automatically extracts discontinuities, fracture
          statistics, over/under-break, and surface displacement.

      - title: Rock fracture identification algorithm based on the confidence score and non-maximum suppression
        authors:
          - "Haoran Xu"
          - "Shibin Tang*"
          - "Jia Wang"
          - "Bo Dong"
          - "Xu Wang"
          - "Kaiwen Zhao"
          - "Jiabao Geng"
        publisher: "Bull. Eng. Geol. Environ., 83(6), 213 · CAS Tier-2 Top, IF 4.2"
        releaseDate: 2024-06-01
        summary: >-
          A fracture-aware detection pipeline combining a learned confidence score with non-maximum
          suppression for thin, low-contrast traces — a building block of the DTGM framework.

      - title: Review for the microseismic source location in surrounding rock of deep-buried tunnels
        authors:
          - "Shibin Tang"
          - "Yonghao Liu"
          - "Haoran Xu"
          - "Ximao Chen"
        publisher: "Journal of Central South University, 30(12), 4182–4196 · JCR Q1, IF 4.4"
        releaseDate: 2023-12-01

